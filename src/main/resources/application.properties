# ── GigShield API Configuration ───────────────────────────────────────────────

# Server
server.port=8080
spring.application.name=gigshield-api

# ── H2 In-Memory Database ──────────────────────────────────────────────────────
# No installation needed — data lives in memory while app is running
spring.datasource.url=jdbc:h2:mem:gigshielddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console — accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.gigshield=DEBUG
logging.level.org.springframework.security=WARN